mel_params:
  sample_rate: 16000
  n_fft: 1024
  win_length: 640
  hop_length: 320
  mel_fmin: 10
  mel_fmax: null
  num_mels: 128
speaker_encoder:
  speaker_encoder_type: ecapa_tdnn
  use_perceiver_encoder: true
  input_dim: 128
  out_dim: 512
  latent_dim: 128
  token_num: 32
  quantizer:
    type: fsq
    fsq:
      levels: [4, 4, 4, 4, 4, 4]
      num_quantizers: 1
    simvq:
      codebook_size: 4096
      commitment: 0.25
  norm_layer: bn
  wavlm_checkpoint: pretrained_models/wavlm/WavLM-Large.pt
codec_encoder:
  use_vqw2v: false
  freeze_vqw2v_encoder: false
  out_channels: 512
  ngf: 32
  up_ratios: [3, 4, 5, 8]
  dilations: [1, 3, 9]
  activation_type: SnakeBeta
  leaky_relu_params:
    negative_slope: 0.1
  encoder_speaker_condition: false
  condition_dim: 512
  snake_logscale: true
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba: {}
codec_decoder:
  in_channels: 512
  upsample_initial_channel: 512
  ngf: 32
  up_ratios: [8, 5, 4, 3]
  dilations: [1, 3, 9]
  quantizer_type: simvq
  freeze_kvq_emb: true
  use_vqw2v_embed: false
  vq_num_quantizers: 1
  vq_dim: 512
  vq_commit_weight: 0.25
  vq_weight_init: false
  vq_full_commit_loss: false
  codebook_size: 300
  codebook_dim: 8
  speaker_condition: true
  condition_dim: 512
  snake_logscale: true
  simvq_linear_layer_type: linear
  ema_decay: 0.0
  activation_type: SnakeBeta
  leaky_relu_params:
    negative_slope: 0.1
  use_mhca: false
  mhca_num_heads: 2
  mhca_dropout: 0.2
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba: {}
mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 256
  channels: 12
  channel_increasing_factor: 4
mstft:
  stft_params:
    fft_sizes: [128, 256, 512, 1024, 2048]
    hop_sizes: [32, 64, 128, 256, 512]
    win_lengths: [128, 256, 512, 1024, 2048]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 16
  max_downsample_channels: 256
  downsample_scales: [2, 2, 2]
  use_weight_norm: true
