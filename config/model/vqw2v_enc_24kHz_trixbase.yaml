defaults:
  - _self_

mel_params:
  sample_rate: 16000
  n_fft: 1024
  win_length: 640
  hop_length: 320
  mel_fmin: 10
  mel_fmax: null
  num_mels: 128
f0_codec:
  use_codec_structure: true
  input_emb_width: 2
  output_emb_width: 128
  levels: 1
  downs_t: [[1, 1, 1, 1]]
  enc_strides_t: [[3, 4, 5, 8]]
  dec_strides_t: [[8, 5, 4, 3]]
  width: 64
  depth: 4
  m_conv: 1.0
  channel_growth_rate: 4
  dilation_growth_rate: 3
  max_channels: null
  encoder_ngf: 16
  encoder_use_rnn: true
  encoder_rnn_bidirectional: false
  encoder_rnn_num_layers: 2
  encoder_up_ratios: [1, 1, 1, 3]
  encoder_dilations: [1, 3, 9]
  encoder_out_channels: 128
  encoder_activation_type: LeakyReLU
  encoder_leaky_relu_params:
    negative_slope: 0.1
  decoder_ngf: 16
  decoder_use_rnn: true
  decoder_rnn_bidirectional: false
  decoder_rnn_num_layers: 2
  decoder_rnn_type: lstm
  decoder_up_ratios: [3, 1, 1, 1]
  decoder_dilations: [1, 3, 9]
  decoder_activation_type: LeakyReLU
  decoder_leaky_relu_params:
    negative_slope: 0.1
  decoder_use_mhca: false
  decoder_mhca_num_heads: 2
  decoder_mhca_dropout: 0.2
  decoder_mhca_key_dim: 128
  decoder_mhca_use_sdpa: true
  spk_cond:
    use: null
    type: [concat]
    num_heads: ${..decoder_mhca_num_heads}
    dropout: ${..decoder_mhca_dropout}
    key_dim: ${..decoder_mhca_key_dim}
    use_sdpa: ${..decoder_mhca_use_sdpa}
  zero_out_all_unvoiced: false
  use_normalized_f0: false
  finetune_f0_extractor: false
  upsample_extracted_f0: false
  use_fcpe_loss: false
  fcpe_out_dims: 360
  use_unnormf0_mse_loss: false
speaker_encoder:
  speaker_encoder_type: ecapa_tdnn
  use_perceiver_encoder: true
  perceiver_use_flash_attn: true
  frozen_wavlm_inference_mode: false
  frozen_wavlm_force_fp32: false
  use_quantizer: true
  input_dim: 128
  out_dim: 512
  latent_dim: 128
  token_num: 32
  quantizer:
    type: fsq
    fsq:
      levels: [4, 4, 4, 4, 4, 4]
      num_quantizers: 1
    simvq:
      codebook_size: 4096
      commitment: 0.25
  norm_layer: bn
  wavlm_checkpoint: pretrained_models/wavlm/WavLM-Large.pt
codec_encoder:
  use_vqw2v: true
  use_vqw2v_continuous: true
  freeze_vqw2v_encoder: true
  frozen_upstream_force_fp32: false
  snake_lite_taylor_degree: 8
  up_ratios: [2]
  dilations: [1, 3, 9]
  ngf: 32
  out_channels: 512
  activation_type: SnakeBeta
  leaky_relu_params:
    negative_slope: 0.1
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba: {}
codec_decoder:
  in_channels: 512
  upsample_initial_channel: 512
  ngf: 32
  snake_lite_taylor_degree: 8
  up_ratios: [8, 5, 4, 3]
  dilations: [1, 3, 9]
  quantizer_type: simvq
  freeze_kvq_emb: true
  use_vqw2v_embed: false
  vq_num_quantizers: 1
  vq_dim: 512
  vq_commit_weight: 0.25
  vq_weight_init: false
  vq_full_commit_loss: false
  quantizer_force_fp32: false
  codebook_size: 300
  codebook_dim: 8
  speaker_condition: true
  f0_condition:
    use: true
    type: [concat]
    start_layer: 0
    end_layer: null
    every: 1
  condition_dim: 512
  snake_logscale: true
  f0_speaker_condition: false
  use_stage_speaker_film: true
  activation_type: SnakeBeta
  leaky_relu_params:
    negative_slope: 0.1
  spk_cond:
    use: true
    type: [film]
    num_heads: ${..mhca_num_heads}
    dropout: ${..mhca_dropout}
    start_layer: 0
    end_layer: null
    every: 1
  use_mhca: false
  mhca_num_heads: 2
  mhca_dropout: 0.2
  mhca_use_sdpa: true
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba: {}
mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 256
  channels: 12
  channel_increasing_factor: 4
mstft:
  stft_params:
    fft_sizes: [128, 256, 512, 1024, 2048]
    hop_sizes: [32, 64, 128, 256, 512]
    win_lengths: [128, 256, 512, 1024, 2048]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 16
  max_downsample_channels: 256
  downsample_scales: [2, 2, 2]
  use_weight_norm: true
