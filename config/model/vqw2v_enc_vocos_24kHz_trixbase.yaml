defaults:
  - _self_

mel_params:
  sample_rate: 16000
  n_fft: 1024
  win_length: 640
  hop_length: 320
  mel_fmin: 10
  mel_fmax: null
  num_mels: 128
f0_codec:
  use_codec_structure: true
  max_channels: 256
  input_emb_width: 2
  output_emb_width: 128
  levels: 1
  downs_t: [[1, 1, 1, 1]]
  enc_strides_t: [[3, 4, 5, 8]]
  dec_strides_t: [[8, 5, 4, 3]]
  width: 64
  depth: 4
  m_conv: 1.0
  channel_growth_rate: 4
  dilation_growth_rate: 3
  encoder_ngf: 16
  encoder_use_rnn: true
  encoder_rnn_bidirectional: false
  encoder_rnn_num_layers: 2
  encoder_up_ratios: [1, 1, 1, 3]
  encoder_dilations: [1, 3, 9]
  encoder_out_channels: 128
  encoder_activation_type: LeakyReLU
  encoder_leaky_relu_params:
    negative_slope: 0.1
  decoder_ngf: 16
  decoder_use_rnn: true
  decoder_rnn_bidirectional: false
  decoder_rnn_num_layers: 2
  decoder_rnn_type: lstm
  decoder_up_ratios: [3, 1, 1, 1]
  decoder_dilations: [1, 3, 9]
  decoder_activation_type: LeakyReLU
  decoder_leaky_relu_params:
    negative_slope: 0.1
  decoder_use_mhca: false
  decoder_mhca_num_heads: 2
  decoder_mhca_dropout: 0.2
  decoder_mhca_key_dim: 128
  decoder_mhca_use_sdpa: true
  spk_cond:
    type: [concat]
    num_heads: ${..decoder_mhca_num_heads}
    dropout: ${..decoder_mhca_dropout}
    key_dim: ${..decoder_mhca_key_dim}
    use_sdpa: ${..decoder_mhca_use_sdpa}
  zero_out_all_unvoiced: false
  use_normalized_f0: false
  finetune_f0_extractor: false
  upsample_extracted_f0: false
  use_fcpe_loss: false
  fcpe_out_dims: 360
  use_unnormf0_mse_loss: false
speaker_encoder:
  speaker_encoder_type: ecapa_tdnn
  use_perceiver_encoder: true
  perceiver_use_flash_attn: true
  use_quantizer: true
  input_dim: 128
  out_dim: 512
  latent_dim: 128
  token_num: 32
  quantizer:
    type: fsq
    fsq:
      levels: [4, 4, 4, 4, 4, 4]
      num_quantizers: 1
    simvq:
      codebook_size: 4096
      commitment: 0.25
  norm_layer: bn
  wavlm_checkpoint: pretrained_models/wavlm/WavLM-Large.pt
codec_encoder:
  use_vqw2v: true
  use_vqw2v_continuous: true
  freeze_vqw2v_encoder: true
  up_ratios: [2]
  dilations: [1, 3, 9]
  ngf: 32
  out_channels: 512
  activation_type: LeakyReLU
  leaky_relu_params:
    negative_slope: 0.1
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba:
      d_state: 64
      d_conv: 4
      expand: 2
      ff_mult: 2
      dropout: 0.0
      use_conv: true
      conv_kernel_size: 5
      conv_bias: true
codec_decoder:
  in_channels: 512
  upsample_initial_channel: 512
  ngf: 32
  up_ratios: [8, 5, 4, 3]
  dilations: [1, 3, 9]
  quantizer_type: simvq
  freeze_kvq_emb: true
  use_vqw2v_embed: false
  vq_num_quantizers: 1
  vq_dim: 512
  vq_commit_weight: 0.25
  vq_weight_init: false
  vq_full_commit_loss: false
  codebook_size: 300
  codebook_dim: 8
  speaker_condition: true
  f0_condition: true
  condition_dim: 512
  snake_logscale: false
  f0_speaker_condition: false
  mhca_use_sdpa: true
  spk_cond:
    use: true
    type: [mhca]
    num_heads: 2
    dropout: 0.2
    use_sdpa: ${..mhca_use_sdpa}
    start_layer: 0
    end_layer: null
    every: 1
  activation_type: LeakyReLU
  leaky_relu_params:
    negative_slope: 0.1
  decoder_type: vocos
  vocos:
    n_fft: 1920
    hop_size: 480
    win_size: 1920
    dim: 512
    intermediate_dim: 1536
    num_layers: 8
    kernel_size: 7
    padding: same
    backbone: convnext
  temporal:
    use: true
    type: lstm
    bidirectional: false
    start_layer: 0
    end_layer: null
    every: 1
    mamba:
      d_state: 64
      d_conv: 4
      expand: 2
      ff_mult: 2
      dropout: 0.0
      use_conv: true
      conv_kernel_size: 5
      conv_bias: true
mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 256
  channels: 16
  channel_increasing_factor: 4
  use_weight_norm: false
mstft:
  stft_params:
    fft_sizes: [78, 126, 206, 334, 542, 876, 1418, 2296]
    hop_sizes: [39, 63, 103, 167, 271, 438, 709, 1148]
    win_lengths: [78, 126, 206, 334, 542, 876, 1418, 2296]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 16
  max_downsample_channels: 256
  downsample_scales: [2, 2, 2]
  use_weight_norm: false
