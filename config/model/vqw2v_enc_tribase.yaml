mel_params:
  sample_rate: 16000
  n_fft: 1024
  win_length: 640
  hop_length: 320
  mel_fmin: 10
  mel_fmax: null
  num_mels: 128
f0_codec:
  input_emb_width: 2
  output_emb_width: 128
  levels: 1
  downs_t: [[1, 1, 1, 1, 1]]
  enc_strides_t: [[2, 2, 2, 4, 5]]
  dec_strides_t: [[5, 4, 2, 2, 2]]
  width: 64
  depth: 4
  m_conv: 1.0
  channel_growth_rate: 4
  dilation_growth_rate: 3
  codebook_size: 128
  codebook_dim: 8
  commitment: 0.25
  codebook_loss_weight: 2.0
  threshold_ema_dead_code: 0.2
  zero_out_all_unvoiced: false
  use_normalized_f0: true
  finetune_f0_extractor: false
speaker_encoder:
  speaker_encoder_type: ecapa_tdnn
  use_perceiver_encoder: true
  input_dim: 128
  out_dim: 512
  latent_dim: 128
  token_num: 32
  quantizer:
    type: fsq
    fsq:
      levels: [4, 4, 4, 4, 4, 4]
      num_quantizers: 1
    simvq:
      codebook_size: 4096
      commitment: 0.25
  norm_layer: bn
codec_encoder:
  use_vqw2v: true
  freeze_vqw2v_encoder: true
codec_decoder:
  in_channels: 512
  upsample_initial_channel: 512
  ngf: 16
  up_ratios: [5, 4, 2, 2, 2]
  dilations: [1, 3, 9]
  quantizer_type: simvq
  freeze_kvq_emb: true
  use_vqw2v_embed: true
  vq_num_quantizers: 1
  vq_dim: 512
  vq_commit_weight: 0.25
  vq_weight_init: false
  vq_full_commit_loss: false
  codebook_size: 1024
  codebook_dim: 8
  speaker_condition: true
  condition_dim: 512
  snake_logscale: true
  simvq_linear_layer_type: linear
  ema_decay: 0.0
  f0_speaker_condition: false
  use_stage_speaker_film: true
  temporal:
    use: true
    type: lstm
    bidirectional: false
    mamba: {}
mpd:
  periods: [2, 3, 5, 7, 11]
  max_downsample_channels: 256
  channels: 12
  channel_increasing_factor: 4
mstft:
  stft_params:
    fft_sizes: [128, 256, 512, 1024, 2048]
    hop_sizes: [32, 64, 128, 256, 512]
    win_lengths: [128, 256, 512, 1024, 2048]
    window: hann_window
  in_channels: 1
  out_channels: 1
  kernel_sizes: [5, 3]
  channels: 16
  max_downsample_channels: 256
  downsample_scales: [2, 2, 2]
  use_weight_norm: true
